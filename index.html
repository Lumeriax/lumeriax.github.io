<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumeriax | Nutracéuticos & Belleza</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #f8f3ec, #e8d8c4);
            color: #332820;
        }

        .page {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 45px 22px 30px;
            text-align: center;
        }

        .logo {
            width: 105px;
            height: 105px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 31px;
            letter-spacing: 5px;
            margin-bottom: 9px;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 32px;
            opacity: 0.75;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            display: block;
            padding: 18px 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.94);
            color: #332820;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.09);
            transition: all 0.25s ease;
        }

        .link:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.14);
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }

        .social {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
            transition: 0.25s;
        }

        .social:hover {
            transform: translateY(-3px);
        }

        .coming-soon {
            margin-top: 24px;
            padding: 13px;
            border-radius: 12px;
            background: rgba(255,255,255,0.45);
            font-size: 13px;
            opacity: 0.75;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.55;
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="logo">
            LX

        <div class="links">

            <a class="link whatsapp"
               href="https://wa.me/message/FVAMZBAORRB7I1"
               target="_blank">
                💬 Escríbenos por WhatsApp
            </a>

            <a class="link"
               href="https://www.instagram.com/lumeriax7?igsi=M3Z1YXg3OXNvODhx"
               target="_blank">
                📸 Síguenos en Instagram
            </a>

            <a class="link"
               href="https://www.tiktok.com/@lumeriax8?_r=1&_t=ZS-99GX568jI72"
               target="_blank">

            </a>

            <a class="link"
               href="https://www.facebook.com/profile.php?id=61593953364297"
               target="_blank">
                👍 Síguenos en Facebook
            </a>

        </div>

        <div class="socials">

            <a class="social"
               href="https://www.instagram.com/lumeriax7?igsi=M3Z1YXg3OXNvODhx"
               target="_blank">
                📸
            </a>

            <a class="social"
               href="https://www.tiktok.com/@lumeriax8?_r=1&_t=ZS-99GX568jI72"
               target="_blank">
                🎵
            </a>

            <a class="social"
               href="https://www.facebook.com/profile.php?id=61593953364297"
               target="_blank">
                👍
            </a>

        </div>

        <div class="coming-soon">
            🛍️ Nuestra tienda online estará disponible próximamente
        </div>

        <footer>
            © 2026 Lumeriax · Todos los derechos reservados
        </footer>

    </main>

</body>
</html>
