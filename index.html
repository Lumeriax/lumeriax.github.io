<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumeriax | Nutracéuticos & Belleza</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: linear-gradient(135deg, #f7f1e8, #ead9c5);
            color: #3d3028;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 45px 25px;
            text-align: center;
        }

        .logo {
            width: 95px;
            height: 95px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            font-size: 30px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .description {
            font-size: 15px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            margin: 14px 0;
            background: white;
            color: #3d3028;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
            transition: 0.25s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 22px rgba(0,0,0,0.15);
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .social {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social a {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 21px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.10);
            transition: 0.25s;
        }

        .social a:hover {
            transform: translateY(-3px);
        }

        footer {
            margin-top: 35px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">

        <a class="button"

        </a>

        <a class="button"

        <div class="social">
