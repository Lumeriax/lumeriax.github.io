<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lumeriax | Nutracéuticos & Belleza</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                linear-gradient(
                    145deg,
                    #f7f1f6 0%,
                    #f4eee7 45%,
                    #eee5f1 100%
                );

            color: #403746;
        }


        /* CONTENEDOR */

        .page {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            padding:
                42px 22px 35px;

            text-align: center;
        }


        /* LOGO */

        .logo {

            width: 100px;

            height: 100px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.94);

            border:
                1px solid #d6bb80;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #b09252;

            font-size: 29px;

            letter-spacing: 4px;

            box-shadow:
                0 10px 28px
                rgba(80,60,90,0.10);
        }


        /* NOMBRE */

        h1 {

            font-size: 31px;

            font-weight: normal;

            letter-spacing: 6px;

            color: #403746;

            margin-bottom: 9px;
        }


        /* DESCRIPCIÓN */

        .subtitle {

            font-size: 15px;

            letter-spacing: 1.4px;

            color: #756a78;

            margin-bottom: 32px;
        }


        /* BOTONES */

        .links {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .link {

            position: relative;

            width: 100%;

            min-height: 61px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                15px 55px;

            border-radius: 16px;

            text-decoration: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 0.3px;

            box-shadow:
                0 6px 18px
                rgba(70,55,75,0.09);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .link:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 24px
                rgba(70,55,75,0.14);
        }


        /* ICONO */

        .icon {

            position: absolute;

            left: 17px;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           WHATSAPP
           ========================= */

        .whatsapp {

            background:
                #c7ead4;

            color:
                #315b43;

            border:
                1px solid #acd8bc;
        }


        .whatsapp .icon {

            background:
                #f8fffa;

            color:
                #4e9b68;
        }


        /* =========================
           INSTAGRAM
           ========================= */

        .instagram {

            background:
                linear-gradient(
                    135deg,
                    #d8c5e4,
                    #e7c5d5,
                    #f0cbb8
                );

            color:
                #604a60;

            border:
                1px solid #d8b9ce;
        }


        .instagram .icon {

            background:
                #fffafd;

            color:
                #b36b91;
        }


        /* =========================
           TIKTOK
           ========================= */

        .tiktok {

            background:
                #d5d1dc;

            color:
                #45414c;

            border:
                1px solid #c2bdca;
        }


        .tiktok .icon {

            background:
                #fdfcff;

            color:
                #655d6d;
        }


        /* =========================
           FACEBOOK
           ========================= */

        .facebook {

            background:
                #c8daf1;

            color:
                #36567b;

            border:
                1px solid #b2cbe8;
        }


        .facebook .icon {

            background:
                #f9fcff;

            color:
                #5d82ad;
        }


        /* =========================
           TIENDA
           ========================= */

        .store {

            margin-top: 4px;

            background:
                linear-gradient(
                    135deg,
                    #e6dced,
                    #f1e6d8
                );

            color:
                #514657;

            border:
                1px solid #d2b878;
        }


        .store .icon {

            background:
                #c8a963;

            color:
                white;
        }


        .coming {

            margin-left: 8px;

            color:
                #a38348;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 12px;

            font-style: italic;

            font-weight: normal;
        }


        /* DETALLE DORADO */

        .divider {

            width: 55px;

            height: 1px;

            margin:
                28px auto 20px;

            background:
                #c9aa68;

            opacity: 0.65;
        }


        .social-note {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 10px;

            letter-spacing: 2px;

            color:
                #8b808e;
        }


        /* PIE */

        footer {

            margin-top: 27px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            color:
                #968c98;
        }


        /* CELULAR */

        @media (max-width: 480px) {

            .page {

                padding:
                    38px 19px 30px;
            }


            .logo {

                width: 90px;

                height: 90px;

                font-size: 25px;
            }


            h1 {

                font-size: 27px;

                letter-spacing: 5px;
            }


            .subtitle {

                font-size: 14px;

                margin-bottom: 29px;
            }


            .link {

                min-height: 58px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <!-- LOGO -->

        <div class="logo">
            LX
        </div>


        <!-- MARCA -->

        <h1>
            LUMERIAX
        </h1>


        <p class="subtitle">
            Nutracéuticos &amp; Belleza
        </p>


        <!-- BOTONES -->

        <div class="links">


            <!-- WHATSAPP -->

            <a
                class="link whatsapp"
                href="https://wa.me/message/FVAMZBAORRB7I1"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    ☎
                </span>

                WhatsApp

            </a>


            <!-- INSTAGRAM -->

            <a
                class="link instagram"
                href="https://www.instagram.com/lumeriax7?igsi=M3Z1YXg3OXNvODhx"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    ◎
                </span>

                Instagram

            </a>


            <!-- TIKTOK -->

            <a
                class="link tiktok"
                href="https://www.tiktok.com/@lumeriax8?_r=1&_t=ZS-99GX568jI72"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    ♪
                </span>

                TikTok

            </a>


            <!-- FACEBOOK -->

            <a
                class="link facebook"
                href="https://www.facebook.com/profile.php?id=61593953364297"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    f
                </span>

                Facebook

            </a>


            <!-- TIENDA -->

            <a
                class="link store"
                href="#"
                onclick="return false;"
            >

                <span class="icon">
                    ✦
                </span>

                Tienda Online

                <span class="coming">
                    Próximamente
                </span>

            </a>


        </div>


        <!-- DETALLE -->

        <div class="divider"></div>


        <p class="social-note">
            CONÉCTATE CON LUMERIAX
        </p>


        <footer>
            © 2026 Lumeriax · Todos los derechos reservados
        </footer>


    </main>


</body>

</html>
